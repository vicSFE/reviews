<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Stylized Sint-Franciscus Evergem school emblem -->
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>
  <!-- Background soft shield/rounded container -->
  <rect x="5" y="5" width="90" height="90" rx="20" fill="rgba(255,255,255,0.12)"/>
  <!-- Elegant Franciscus stylized cross/ribbon lines -->
  <path d="M 28 22 C 28 22, 45 20, 52 28 C 58 35, 52 48, 42 50 C 35 52, 28 50, 28 50 L 28 78" 
        stroke="url(#logoGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 45 42 C 45 42, 65 38, 72 48 C 78 57, 70 70, 55 72 C 45 73, 38 72, 38 72" 
        stroke="#00A3A3" stroke-width="8" stroke-linecap="round" fill="none"/>
  <circle cx="68" cy="28" r="5" fill="#F4B400"/>
</svg>
