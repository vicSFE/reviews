<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Reviews</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/styles.css" />
</head>
<body>

  <header class="site-header">
    <div class="wrap">
      <a class="wordmark" href="../index.html">Reviews<span>.com</span></a>
      <nav class="site-nav">
        <a href="../index.html">Games</a>
      </nav>
    </div>
  </header>

  <main class="wrap" id="game-root">
  </main>

  <footer class="site-footer">
    <div class="wrap">
      Reviews.com word een van de grootste reviewplatforms ter wereld.
    </div>
  </footer>

  <script>const IMG_BASE = "../../";</script>
  <script src="../../js/main.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const slug = params.get("slug");
    const game = GAMES.find((g) => g.slug === slug);
    const root = document.getElementById("game-root");

    if (!game) {
      root.innerHTML = `
        <div style="padding:64px 0;">
          <h1>Deze game kennen we niet</h1>
          <p style="color:var(--cream-dim)">Controleer de link, of ga terug naar het overzicht.</p>
          <a class="back-link" href="../index.html">&larr; Terug naar alle games</a>
        </div>`;
    } else {
      document.getElementById("page-title").textContent = game.title + " — Reviews.com";
      renderGamePage();
    }

    function renderGamePage() {
      const reviews = getReviews(game.slug);
      const avg = communityAverage(game.slug);

      root.innerHTML = `
        <div class="game-head">
          ${coverMarkup(game, "")}
          <div>
            <div class="genre-tag">${game.genre}</div>
            <h1>${game.title}</h1>
            <p class="blurb">${game.blurb}</p>
            <div class="score-row">
              <div class="score-block ${scoreClass(game.officialScore)}">
                <span class="num">${game.officialScore.toFixed(1)}</span>
                <span class="label">redactie</span>
              </div>
              <div class="score-block ${avg ? scoreClass(avg) : ""}">
                <span class="num">${avg ? avg.toFixed(1) : "—"}</span>
                <span class="label">community${avg ? " (" + reviews.length + ")" : ""}</span>
              </div>
            </div>
          </div>
        </div>

        <section class="review-section">
          <form class="review-form" id="review-form">
            <h2 style="font-size:1.1rem; margin-bottom:18px;">Schrijf je eigen review</h2>

            <div class="field">
              <label for="reviewer-name">Naam</label>
              <input type="text" id="reviewer-name" placeholder="Hoe wil je genoemd worden?" required />
            </div>

            <div class="field">
              <label>Cijfer</label>
              <div class="score-picker" id="score-picker">
                ${Array.from({ length: 10 }, (_, i) => i + 1)
                  .map((n) => `<button type="button" data-score="${n}">${n}</button>`)
                  .join("")}
              </div>
            </div>

            <div class="field">
              <label for="reviewer-text">Je review</label>
              <textarea id="reviewer-text" placeholder="Wat vond je van deze game?" required></textarea>
            </div>

            <button type="submit" class="submit-btn">Review plaatsen</button>
            <p class="form-note">Je review wordt lokaal in deze browser bewaard.</p>
          </form>

          <div class="reviews-list">
            <h2>Reviews (${reviews.length})</h2>
            <div id="reviews-container">
              ${reviews.length === 0 ? '<p class="empty-note">Nog geen reviews. Wees de eerste!</p>' : reviews.map(reviewMarkup).join("")}
            </div>
          </div>
        </section>

        <a class="back-link" href="../index.html">&larr; Terug naar alle games</a>
      `;

      attachFormHandlers();
    }

    function reviewMarkup(r) {
      return `
        <div class="review-card">
          <div class="review-top">
            <span class="author">${escapeHtml(r.name)}</span>
            <span class="review-score ${scoreClass(r.score)}">${r.score}/10</span>
          </div>
          <p>${escapeHtml(r.text)}</p>
        </div>`;
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function attachFormHandlers() {
      let selectedScore = null;
      const buttons = document.querySelectorAll("#score-picker button");
      buttons.forEach((btn) => {
        btn.addEventListener("click", () => {
          buttons.forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          selectedScore = Number(btn.dataset.score);
        });
      });

      document.getElementById("review-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const name = document.getElementById("reviewer-name").value.trim();
        const text = document.getElementById("reviewer-text").value.trim();

        if (!name || !text || !selectedScore) {
          alert("Vul je naam, een cijfer en je review in.");
          return;
        }

        saveReview(game.slug, { name, text, score: selectedScore });
        renderGamePage();
      });
    }
  </script>
</body>
</html>
