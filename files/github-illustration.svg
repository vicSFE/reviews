<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="githubTitle" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="githubTitle">Illustratie van een git-vertakkingsdiagram met commits, symbool voor de GitHub basisvaardigheden</title>
  <defs>
    <linearGradient id="gBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F2A2A"/>
      <stop offset="1" stop-color="#0B3D91"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#gBg)"/>

  <g fill="none" stroke="#00E5C7" stroke-width="6" stroke-linecap="round">
    <path d="M240 480 V220"/>
    <path d="M240 340 C240 300 330 300 330 260"/>
    <path d="M330 260 V140"/>
    <path d="M240 260 C240 300 150 300 150 340"/>
    <path d="M150 340 V420"/>
  </g>

  <g fill="#F4B400">
    <circle cx="240" cy="480" r="16"/>
    <circle cx="240" cy="340" r="16"/>
    <circle cx="240" cy="220" r="16"/>
    <circle cx="330" cy="260" r="16"/>
    <circle cx="330" cy="140" r="16"/>
    <circle cx="150" cy="340" r="16"/>
    <circle cx="150" cy="420" r="16"/>
  </g>

  <g fill="#FFFFFF" opacity="0.92">
    <rect x="470" y="150" width="230" height="46" rx="8"/>
    <rect x="470" y="230" width="180" height="46" rx="8" opacity="0.7"/>
    <rect x="470" y="310" width="210" height="46" rx="8" opacity="0.5"/>
  </g>

  <g fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round">
    <path d="M455 265 L430 240 L455 215"/>
    <path d="M700 215 L725 240 L700 265"/>
  </g>
</svg>
