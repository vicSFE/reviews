<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mitnickTitle" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="mitnickTitle">Illustratie van een figuur met hoodie omringd door een reeks van nullen en enen, symbool voor de Kevin Mitnick Games</title>
  <defs>
    <linearGradient id="mBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F3A"/>
      <stop offset="1" stop-color="#123A63"/>
    </linearGradient>
    <radialGradient id="mSpot" cx="0.5" cy="0.38" r="0.5">
      <stop offset="0" stop-color="#00A3A3" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#00A3A3" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#mBg)"/>
  <ellipse cx="400" cy="300" rx="320" ry="280" fill="url(#mSpot)"/>

  <g fill="#5FE3D1" opacity="0.35" font-family="Consolas, monospace" font-size="20">
    <text x="40" y="60">01001</text>
    <text x="620" y="80">110010</text>
    <text x="60" y="540">100110</text>
    <text x="600" y="560">01101</text>
    <text x="60" y="150">011</text>
    <text x="680" y="220">10</text>
    <text x="90" y="420">0110</text>
    <text x="660" y="440">1011</text>
  </g>

  <!-- hoodie figure -->
  <path d="M270 560 C270 440 300 340 400 320 C500 340 530 440 530 560 Z" fill="#050B18"/>
  <path d="M330 350 C330 280 355 235 400 235 C445 235 470 280 470 350 C470 400 440 420 400 420 C360 420 330 400 330 350 Z" fill="#0A1730"/>
  <path d="M355 340 C355 300 372 270 400 270 C428 270 445 300 445 340 C445 372 424 390 400 390 C376 390 355 372 355 340 Z" fill="#000000"/>

  <!-- lock icon -->
  <g transform="translate(560,420)">
    <rect x="0" y="26" width="70" height="56" rx="8" fill="#F4B400"/>
    <path d="M12 26 V6 C12 -8 58 -8 58 6 V26" fill="none" stroke="#F4B400" stroke-width="9"/>
    <circle cx="35" cy="54" r="8" fill="#0B1F3A"/>
  </g>
</svg>
