<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroTitle" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="heroTitle">Illustratie van een IT-werkplek met drie beeldschermen, op de achtergrond een print van een circuit</title>
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1F3A"/>
      <stop offset="1" stop-color="#0B3D91"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00E5C7"/>
      <stop offset="1" stop-color="#00A3A3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#00A3A3" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00A3A3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#skyGrad)"/>

  <!-- circuit trace pattern -->
  <g stroke="#1E4E9C" stroke-width="2" fill="none" opacity="0.55">
    <path d="M0 120 H220 V60 H520"/>
    <path d="M0 260 H160 V340 H460 V220 H900"/>
    <path d="M1200 100 H980 V180 H760"/>
    <path d="M1200 620 H1000 V520 H700"/>
    <path d="M0 620 H260 V700 H600"/>
    <path d="M1200 300 H1040 V400"/>
  </g>
  <g fill="#1E4E9C" opacity="0.8">
    <circle cx="220" cy="120" r="5"/>
    <circle cx="520" cy="60" r="5"/>
    <circle cx="160" cy="260" r="5"/>
    <circle cx="460" cy="340" r="5"/>
    <circle cx="900" cy="220" r="5"/>
    <circle cx="980" cy="100" r="5"/>
    <circle cx="760" cy="180" r="5"/>
    <circle cx="1000" cy="620" r="5"/>
    <circle cx="700" cy="520" r="5"/>
    <circle cx="260" cy="620" r="5"/>
    <circle cx="600" cy="700" r="5"/>
    <circle cx="1040" cy="300" r="5"/>
  </g>

  <ellipse cx="600" cy="430" rx="480" ry="320" fill="url(#glow)"/>

  <!-- desk -->
  <rect x="120" y="620" width="960" height="26" rx="4" fill="#08152B"/>
  <rect x="150" y="646" width="18" height="90" fill="#08152B"/>
  <rect x="1032" y="646" width="18" height="90" fill="#08152B"/>

  <!-- side monitors -->
  <g>
    <rect x="200" y="430" width="230" height="150" rx="10" fill="#0F2A52" stroke="#1E4E9C" stroke-width="4"/>
    <rect x="216" y="446" width="198" height="118" rx="4" fill="url(#screenGrad)" opacity="0.85"/>
    <rect x="300" y="580" width="30" height="26" fill="#0F2A52"/>
    <rect x="270" y="606" width="90" height="10" rx="4" fill="#0F2A52"/>
  </g>
  <g>
    <rect x="770" y="430" width="230" height="150" rx="10" fill="#0F2A52" stroke="#1E4E9C" stroke-width="4"/>
    <rect x="786" y="446" width="198" height="118" rx="4" fill="url(#screenGrad)" opacity="0.85"/>
    <rect x="870" y="580" width="30" height="26" fill="#0F2A52"/>
    <rect x="840" y="606" width="90" height="10" rx="4" fill="#0F2A52"/>
  </g>

  <!-- center monitor -->
  <g>
    <rect x="435" y="360" width="330" height="220" rx="12" fill="#0F2A52" stroke="#F4B400" stroke-width="4"/>
    <rect x="455" y="380" width="290" height="180" rx="6" fill="url(#screenGrad)"/>
    <rect x="580" y="580" width="40" height="34" fill="#0F2A52"/>
    <rect x="540" y="614" width="120" height="12" rx="5" fill="#0F2A52"/>
    <g stroke="#0B1F3A" stroke-width="5" opacity="0.55">
      <line x1="480" y1="410" x2="700" y2="410"/>
      <line x1="480" y1="440" x2="660" y2="440"/>
      <line x1="480" y1="470" x2="720" y2="470"/>
      <line x1="480" y1="500" x2="620" y2="500"/>
      <line x1="480" y1="530" x2="690" y2="530"/>
    </g>
  </g>

  <!-- person silhouette, back view -->
  <g fill="#050B18">
    <path d="M545 730 C545 640 570 590 600 590 C630 590 655 640 655 730 Z"/>
    <path d="M578 600 C578 555 588 520 600 520 C612 520 622 555 622 600 Z"/>
    <circle cx="600" cy="500" r="28"/>
  </g>

  <!-- chevrons -->
  <g fill="none" stroke="#F4B400" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M960 120 L940 145 L960 170"/>
    <path d="M985 120 L1005 145 L985 170"/>
  </g>
</svg>
