<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="nokiaTitle" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="nokiaTitle">Illustratie van een kantoorgebouw met telecommast en signaalgolven, symbool voor het bezoek aan Nokia</title>
  <defs>
    <linearGradient id="nSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFE3FF"/>
      <stop offset="1" stop-color="#EAF6FF"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#nSky)"/>

  <!-- ground -->
  <rect x="0" y="500" width="800" height="100" fill="#D7E9F2"/>

  <!-- mast -->
  <g stroke="#0B3D91" stroke-width="6" fill="none">
    <line x1="640" y1="500" x2="640" y2="160"/>
    <line x1="600" y1="500" x2="640" y2="160"/>
    <line x1="680" y1="500" x2="640" y2="160"/>
    <line x1="612" y1="420" x2="668" y2="420"/>
    <line x1="618" y1="340" x2="662" y2="340"/>
    <line x1="626" y1="260" x2="654" y2="260"/>
  </g>
  <g fill="none" stroke="#00A3A3" stroke-width="5" opacity="0.8">
    <path d="M640 150 C660 130 660 100 640 80"/>
    <path d="M640 150 C670 122 670 78 640 50"/>
    <path d="M640 150 C620 130 620 100 640 80"/>
    <path d="M640 150 C610 122 610 78 640 50"/>
  </g>

  <!-- main building -->
  <rect x="140" y="200" width="300" height="300" fill="#0B3D91"/>
  <rect x="140" y="200" width="300" height="18" fill="#062654"/>
  <g fill="#5FC9E8" opacity="0.85">
    <rect x="165" y="235" width="40" height="34"/>
    <rect x="225" y="235" width="40" height="34"/>
    <rect x="285" y="235" width="40" height="34"/>
    <rect x="345" y="235" width="40" height="34"/>
    <rect x="165" y="290" width="40" height="34"/>
    <rect x="225" y="290" width="40" height="34"/>
    <rect x="285" y="290" width="40" height="34"/>
    <rect x="345" y="290" width="40" height="34"/>
    <rect x="165" y="345" width="40" height="34"/>
    <rect x="225" y="345" width="40" height="34"/>
    <rect x="285" y="345" width="40" height="34"/>
    <rect x="345" y="345" width="40" height="34"/>
    <rect x="165" y="400" width="40" height="34"/>
    <rect x="225" y="400" width="40" height="34"/>
    <rect x="285" y="400" width="40" height="34"/>
    <rect x="345" y="400" width="40" height="34"/>
  </g>
  <rect x="250" y="455" width="80" height="45" fill="#062654"/>

  <!-- side low building -->
  <rect x="440" y="330" width="150" height="170" fill="#00A3A3"/>
  <g fill="#EAF6FF" opacity="0.85">
    <rect x="460" y="355" width="30" height="26"/>
    <rect x="505" y="355" width="30" height="26"/>
    <rect x="460" y="400" width="30" height="26"/>
    <rect x="505" y="400" width="30" height="26"/>
    <rect x="460" y="445" width="30" height="26"/>
    <rect x="505" y="445" width="30" height="26"/>
  </g>

  <!-- trees -->
  <g fill="#2F8F5B">
    <circle cx="90" cy="470" r="26"/>
    <rect x="84" y="470" width="12" height="30" fill="#5C4326"/>
    <circle cx="620" cy="480" r="20"/>
    <rect x="614" y="480" width="10" height="22" fill="#5C4326"/>
  </g>
</svg>
